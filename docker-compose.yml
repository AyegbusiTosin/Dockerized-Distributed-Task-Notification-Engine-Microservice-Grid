#version: '3.8'

#  Define the environment variables matrix to share across our containers
x-environment: &django-env
  DEBUG: "True"
  SECRET_KEY: "dev-secret-key-change-in-production"
  DB_NAME: "notification_db"
  DB_USER: "notification_user"
  DB_PASSWORD: "my_secure_password"
  DB_HOST: "postgres_db"       # Points to the Postgres container name, not localhost!
  DB_PORT: "5432"
  CELERY_BROKER_URL: "redis://redis_queue:6379/0" #  Points to the Redis container name!
  CELERY_RESULT_BACKEND: "redis://redis_queue:6379/0"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend" # Temporary fallback inside docker for safety
  TZ: "UTC"

services:
  #  Service 1: The PostgreSQL Database Core Engine
  postgres_db:
    image: postgres:15-alpine
    container_name: notification_postgres
    environment:
      POSTGRES_DB: "notification_db"
      POSTGRES_USER: "notification_user"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Keeps your database records alive when containers stop
    ports:
      - "5432:5432"

  #  Service 2: The Redis RAM Message Queue Broker
  redis_queue:
    image: redis:7-alpine
    container_name: notification_redis
    ports:
      - "6379:6379"

  #  Service 3: The Django Web Gateway API
  web_api:
    build: .
    container_name: notification_django
    volumes:
      - .:/app # Syncs your local code edits directly into the live running container
    ports:
      - "8000:8000"
    environment: *django-env
    depends_on:
      - postgres_db
      - redis_queue

  #  Service 4: The Celery Asynchronous Background Processing Workers Pool
  celery_worker:
    build: .
    container_name: notification_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    environment: *django-env
    depends_on:
      - redis_queue
      - postgres_db

  #  Service 5: The Celery Beat Temporal Clock Conductor
  celery_beat:
    build: .
    container_name: notification_beat
    command: celery -A core beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app
    environment: *django-env
    depends_on:
      - redis_queue
      - postgres_db

#  Persistent Disk Allocation Registry
volumes:
  postgres_data:
